# A clean Windows install lacks the Visual C++ runtime, so link it into the exe.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ggml otherwise compiles for the build machine's CPU, so releases would crash on older ones.
# AVX2/FMA/F16C covers x86 CPUs from 2013 on; ARM builds ignore these. System BLAS would add a
# runtime library the release binary cannot assume.
[env]
TRANSCRIBE_CMAKE_ARGS = "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF"
