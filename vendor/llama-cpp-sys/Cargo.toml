[package]
name = "typeaside-llama-cpp-sys"
version = "0.1.0"
edition = "2024"
license = "MIT"
links = "typeaside_llama"

[workspace]

[features]
vulkan = ["transcribe-cpp-sys/vulkan"]
metal = ["transcribe-cpp-sys/metal"]

[dependencies]
transcribe-cpp-sys = { version = "=0.4.1", default-features = false }

[dev-dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false }

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"
