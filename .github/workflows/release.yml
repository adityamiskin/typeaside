name: Release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable publishes; staging uploads under staging/<run-id>/ and skips the AUR push
        type: choice
        options: [stable, staging]
        default: stable
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prefix: ${{ steps.version.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Require main and read version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Releases run from main only" >&2
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$CHANNEL" == staging ]]; then
            echo "prefix=staging/$GITHUB_RUN_ID/" >> "$GITHUB_OUTPUT"
          fi
        env:
          CHANNEL: ${{ inputs.channel }}
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-xkb-dev libxcb-xfixes0-dev libxcb-randr0-dev libx11-xcb-dev libssl-dev pkg-config clang cmake librsvg2-bin file
      # Chocolatey's minisign cannot read the signing key; the upload job signs the Windows installer.
      - name: Install Minisign
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl --fail --location --retry 3 -o "$RUNNER_TEMP/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
              echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum --check
              tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
              install -Dm755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/bin/minisign"
              echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
              ;;
            macOS) brew install minisign ;;
          esac
      # transcribe.cpp compiles its Vulkan backend from source. Ubuntu 22.04 does not package glslc.
      - name: Install the Vulkan SDK on Linux
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/vulkansdk.tar.xz" https://sdk.lunarg.com/sdk/download/1.4.309.0/linux/vulkansdk-linux-x86_64-1.4.309.0.tar.xz
          echo "616a25a9d8b33336e83957f97ca273b8e95461649723354300d02c26ae52a1f6  $RUNNER_TEMP/vulkansdk.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/1.4.309.0/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Install the Vulkan SDK on Windows
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$("$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/')"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - run: cargo build --locked --release
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          TYPEASIDE_SIGNING_KEY: ${{ secrets.TYPEASIDE_SIGNING_KEY }}
        run: packaging/macos/package.sh
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          TYPEASIDE_SIGNING_KEY: ${{ secrets.TYPEASIDE_SIGNING_KEY }}
        run: packaging/linux/package.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" packaging/windows/typeaside.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: typeaside-${{ matrix.platform }}-installers
          path: dist/*
          if-no-files-found: error
  upload:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: typeaside-*-installers
          merge-multiple: true
          path: dist
      - uses: oven-sh/setup-bun@v2
      - name: Install Minisign
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          install -Dm755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/bin/minisign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign Windows installer
        env:
          TYPEASIDE_SIGNING_KEY: ${{ secrets.TYPEASIDE_SIGNING_KEY }}
        run: packaging/sign.sh dist/TypeAside-setup.exe
      - name: Upload installers and latest manifest to R2
        env:
          TYPEASIDE_SIGNING_KEY: ${{ secrets.TYPEASIDE_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.version.outputs.version }}
          PREFIX: ${{ needs.version.outputs.prefix }}
        run: packaging/upload.sh
      - name: Publish the GitHub release
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "TypeAside $VERSION" --generate-notes \
            dist/TypeAside.dmg dist/TypeAside-setup.exe dist/TypeAside.AppImage dist/typeaside.deb dist/typeaside.rpm \
            dist/*.minisig dist/latest.json
  aur:
    needs: [version, upload]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      # typeaside.app blocks GitHub runners, so checksum the artifact we just uploaded.
      - uses: actions/download-artifact@v4
        with:
          name: typeaside-linux-installers
          path: dist
      - name: Publish typeaside-bin to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          PUSH: ${{ inputs.channel == 'stable' }}
        run: |
          pacman -Syu --noconfirm --needed git openssh
          useradd -m builder
          install -d -m700 -o builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown -R builder /home/builder/.ssh && chmod 600 /home/builder/.ssh/id_ed25519
          # makepkg refuses to run as root.
          su builder -c "VERSION=$VERSION PUSH=$PUSH DEB=$PWD/dist/typeaside.deb packaging/aur/publish.sh"
