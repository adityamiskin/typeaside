name: typeaside
arch: amd64
version: ${VERSION}
maintainer: Aditya Miskin <adityamiskin@users.noreply.github.com>
description: Native voice dictation for Wayland
section: utils
priority: optional
contents:
  - src: target/release/typeaside
    dst: /usr/bin/typeaside
    file_info:
      mode: 0755
  - src: packaging/typeaside.desktop
    dst: /usr/share/applications/typeaside.desktop
    file_info:
      mode: 0644
  - src: assets/typeaside.svg
    dst: /usr/share/icons/hicolor/scalable/apps/typeaside.svg
    file_info:
      mode: 0644
  - src: packaging/linux/70-typeaside.rules
    dst: /usr/lib/udev/rules.d/70-typeaside.rules
    file_info:
      mode: 0644
  - src: packaging/linux/typeaside-modules.conf
    dst: /usr/lib/modules-load.d/typeaside.conf
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postrm.sh
overrides:
  deb:
    depends:
      - libasound2
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libfreetype6
      - libxcb1
      - libxcb-xkb1
      - libxcb-xfixes0
      - libxcb-randr0
      - libx11-xcb1
      - libvulkan1
      - mesa-vulkan-drivers
      - libstdc++6
      - libc6 (>= 2.35)
  rpm:
    depends:
      - alsa-lib
      - systemd-libs
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libxkbcommon
      - libxkbcommon-x11
      - fontconfig
      - freetype
      - libxcb
      - libX11-xcb
      - vulkan-loader
      - mesa-vulkan-drivers
      - libstdc++
      - glibc
