[package]
name = "typeaside"
version = "0.2.24"
edition = "2024"

[dependencies]
getrandom = "0.3"
anyhow = "1.0.100"
cpal = "0.17.3"
directories = "6.0.0"
keyring = "4.0.0-rc.3"
keyring-core = "0.7.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
semver = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
# core (owned by engine work)
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
regex = "1"
# ui (owned by GPUI work)
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-kit = "0.7.3"
chrono = "0.4"
flacenc = { version = "0.5.1", default-features = false }
minisign-verify = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["wayland"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["wayland"] }
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
atspi = { version = "0.29", default-features = false, features = ["proxies", "zbus"] }
evdev = "0.13.2"
nix = { version = "0.30", features = ["poll"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = "3.6"
enigo = { version = "0.6.1", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSRunningApplication", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = "2.4"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Variant"] }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
keyring = { path = "vendor/keyring" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
panic = "abort"
strip = true
opt-level = "s"
