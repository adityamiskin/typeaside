[package]
name = "hermes"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
arboard = "3.6.1"
cpal = "0.17.3"
directories = "6.0.0"
enigo = { version = "0.6.1", features = ["wayland"] }
global-hotkey = "0.7.0"
keyring = "4.0.0-rc.3"
keyring-core = "0.7.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# core (owned by engine work)
async-channel = "2"
# ui (owned by GPUI work)
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["wayland"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["wayland", "font-kit", "runtime_shaders"] }
gpui-kit = "0.7.3"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[patch.crates-io]
keyring = { path = "vendor/keyring" }
