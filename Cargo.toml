[package]
name = "hermes"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
arboard = "3.6.1"
cpal = "0.17.3"
directories = "6.0.0"
enigo = { version = "0.6.1", features = ["wayland"] }
global-hotkey = "0.7.0"
keyring = "4.0.0-rc.3"
keyring-core = "0.7.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[patch.crates-io]
keyring = { path = "vendor/keyring" }
